<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Bawi! - Senior High School Academic OS</title>
  <meta name="description" content="Senior High School Academic Operating System">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="prototype.css">
  <style>
    /* Centered Welcome Page Layout */
    .welcome-viewport {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background-color: var(--canvas-bg);
    }

    .welcome-card {
      width: 100%;
      max-width: 520px;
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px;
    }

    .welcome-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .welcome-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      margin: 0 auto 16px auto;
      display: block;
    }

    .welcome-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
      line-height: 1.2;
    }

    .welcome-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .welcome-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome-btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: background-color 0.15s ease;
    }

    .welcome-btn-submit:hover {
      background: var(--primary-hover);
    }

    .welcome-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="welcome-viewport">
    <div class="welcome-card">
      <div class="welcome-header">
        <img src="logo-ba.png" alt="Baybayin Ba Logo" class="welcome-logo">
        <h1 class="welcome-title">Bawi!</h1>
        <p class="welcome-subtitle">Senior High School Academic Operating System</p>
      </div>

      <form class="welcome-form" id="welcomeSetupForm" onsubmit="handleLaunch(event)">
        <div class="form-group-clean">
          <label>Student Full Name</label>
          <input type="text" id="welcomeStudentName" value="Juan Dela Cruz" required placeholder="Enter student name">
        </div>

        <div class="form-group-clean">
          <label>Senior High School Strand</label>
          <select id="welcomeStrand" required>
            <option value="STEM" selected>STEM (Science, Tech, Eng, Math)</option>
            <option value="ABM">ABM (Accountancy, Business, Management)</option>
            <option value="HUMSS">HUMSS (Humanities & Social Sciences)</option>
            <option value="TVL">TVL (Technical-Vocational-Livelihood)</option>
          </select>
        </div>

        <div class="form-group-clean">
          <label>Grade Level</label>
          <select id="welcomeGradeLevel" required>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12" selected>Grade 12</option>
          </select>
        </div>

        <div class="form-group-clean">
          <label>Target General Average</label>
          <input type="number" id="welcomeTargetGrade" value="95" min="75" max="100" step="1" required placeholder="e.g. 95">
        </div>

        <button type="submit" class="welcome-btn-submit">
          <span>Get Started</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'bawi_canva_prototype_v2';

    // Populate existing state if present
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.profile) {
            document.getElementById('welcomeStudentName').value = parsed.profile.name || 'Juan Dela Cruz';
            document.getElementById('welcomeStrand').value = parsed.profile.strand || 'STEM';
            document.getElementById('welcomeGradeLevel').value = parsed.profile.gradeLevel || 'Grade 12';
            document.getElementById('welcomeTargetGrade').value = parsed.profile.targetGrade || 95;
          }
        } catch (e) {
          console.error(e);
        }
      }
    });

    function handleLaunch(event) {
      event.preventDefault();
      const name = document.getElementById('welcomeStudentName').value.trim() || 'Juan Dela Cruz';
      const strand = document.getElementById('welcomeStrand').value;
      const gradeLevel = document.getElementById('welcomeGradeLevel').value;
      const targetGrade = parseInt(document.getElementById('welcomeTargetGrade').value, 10) || 95;

      // Update or initialize prototype state
      let state = null;
      try {
        state = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (e) {}

      if (!state || !state.subjects) {
        // Let prototype.js initialize defaults, but prime profile
        state = {
          profile: {
            name,
            strand,
            gradeLevel,
            targetGrade
          }
        };
      } else {
        state.profile = {
          name,
          strand,
          gradeLevel,
          targetGrade
        };
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
